[package]
name = "siderust-web"
version = "0.1.0"
edition = "2021"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
license = "AGPL-3.0"
repository = "https://github.com/Siderust/siderust"
description = "Browser/WASM bindings for siderust — high-precision astronomy in the browser"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
siderust = { path = "../siderust", features = [] }
qtty     = "0.4.0"
tempoch  = "0.3"
affn     = { version = "0.3.3", features = ["astro"] }
chrono   = "0.4"

wasm-bindgen            = "0.2"
serde                   = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen      = "0.6"
js-sys                  = "0.3"
console_error_panic_hook = "0.1"

[patch.crates-io]
affn    = { path = "../siderust/dev-deps/affn" }
cheby   = { path = "../siderust/dev-deps/cheby" }
tempoch = { path = "../siderust/dev-deps/tempoch/tempoch" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
lto = true
strip = true
opt-level = "s"
