[package]
name = "siderust-node"
version = "0.1.0"
edition = "2021"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
license = "AGPL-3.0"
repository = "https://github.com/Siderust/siderust"
description = "Node.js native bindings for siderust — high-precision astronomy and satellite mechanics"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
siderust = { path = "../siderust", features = [] }
qtty     = "0.4.0"
tempoch  = "0.3"
affn     = { version = "0.3.3", features = ["astro"] }
chrono   = "0.4"
napi     = { version = "2", features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[patch.crates-io]
affn    = { path = "../siderust/dev-deps/affn" }
cheby   = { path = "../siderust/dev-deps/cheby" }
tempoch = { path = "../siderust/dev-deps/tempoch/tempoch" }

[profile.release]
lto = true
strip = "symbols"
